name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Проверка 1: Сервер физической симуляции (TypeScript + 16 тестов)
  backend-physics:
    name: Backend Physics Validation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: VVER_1200_Sim_Server/package-lock.json

      - name: Install dependencies
        working-directory: VVER_1200_Sim_Server
        run: npm ci

      - name: Run 16 Automated Physics Validation Tests
        working-directory: VVER_1200_Sim_Server
        run: npm run simulation:test

      - name: Build TypeScript Project
        working-directory: VVER_1200_Sim_Server
        run: npm run build

  # Проверка 2: Клиентская веб-панель (React SPA)
  frontend-ui:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: power-unit-operator-simulator/package-lock.json

      - name: Install dependencies
        working-directory: power-unit-operator-simulator
        run: npm ci

      - name: Build Production Bundle
        working-directory: power-unit-operator-simulator
        run: npm run build
